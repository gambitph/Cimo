name: E2E Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Build plugin for e2e testing
      run: npm run build:e2e

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Start WordPress environment
      run: npx wp-env start

    - name: Create .env file for Playwright
      run: |
        cat <<EOF > .env
        WP_BASE_URL=http://localhost:8889
        WP_AUTH_STORAGE=wp-auth.json
        WP_USERNAME=admin
        WP_PASSWORD=password
        CIMO_SLUG=Cimo/cimo
        EOF

    - name: Run Playwright e2e tests
      run: npm run test -- -g "Media Library drop"

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14

    - name: Print WordPress logs on failure
      if: failure()
      run: npx wp-env logs tests --no-watch
