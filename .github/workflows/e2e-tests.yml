name: E2E Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  e2e:
    name: Playwright e2e (Playground CLI)
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Browser-driven specs need build/admin/ (gitignored). Without this,
      # class-script-loader.php skips enqueue and waitForCimoReady times out.
      - name: Build plugin for e2e testing
        run: npm run build:e2e

      # No Docker / wp-env: playwright.config.js's `webServer` spawns
      # `@wp-playground/cli` (WASM PHP + SQLite) and tears it down after the run.
      - name: Run Playwright e2e suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  e2e-elementor:
    name: Playwright e2e Elementor (Playground CLI)
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build plugin for e2e testing
        run: npm run build:e2e

      # Fetches gitignored elementor.zip, then runs the Elementor smoke.
      # PWDEBUG=console keeps browser console / page errors in the job log for triage.
      - name: Run Playwright Elementor e2e suite
        env:
          PWDEBUG: console
          DEBUG: pw:webserver
        run: npm run test:e2e:elementor

      - name: Upload Elementor Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-elementor
          path: playwright-report-elementor/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Elementor failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-elementor-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
